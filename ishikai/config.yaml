meta:
  version: 3
  flow: Classic

DESIGN_NAME: megabytebeat_macro
VERILOG_FILES:
  - dir::../src/megabytebeat.v
  - dir::../src/sc_r2r_dac_8bit.v
  - dir::megabytebeat_macro.sv

PNR_SDC_FILE: dir::megabytebeat_macro.sdc
SIGNOFF_SDC_FILE: dir::megabytebeat_macro.sdc

# Separate VDD_BB power domain, shared VSS
VDD_NETS:
  - VDD_BB
GND_NETS:
  - VSS

# Clock: 32.768 kHz (/4 = 8.192 kHz DAC audio sample rate)
CLOCK_PORT: clk
CLOCK_PERIOD: 30517.5

# Floorplan: 960 x 960 um (VDD_BB mixed-signal macro with 5x passive 8-bit R-2R DACs)
FP_SIZING: absolute
DIE_AREA: [0, 0, 960, 960]
CORE_AREA: [30, 30, 930, 930]
FP_PIN_ORDER_CFG: dir::pin_order.cfg
FP_MACRO_HORIZONTAL_HALO: 4.8
FP_MACRO_VERTICAL_HALO: 4.0

# 5x pure-passive poly-resistor R-2R DAC ladders placed near their West (ua[0..2]) and East (ua[3..4]) pins
MACROS:
  r2r_ladder_8bit:
    gds:
      - dir::../gen/dac/r2r_ladder_8bit.gds
    lef:
      - dir::../gen/dac/r2r_ladder_8bit.lef
    vh:
      - dir::../src/r2r_ladder_8bit.v
    lib:
      "*":
        - dir::../gen/dac/r2r_ladder_8bit.lib
    spice:
      - dir::../gen/dac/r2r_ladder_8bit.spice

# Reserve Metal5 for PDN + chip_top VDD_BB power straps
RT_MAX_LAYER: Metal4

# PDN: clean Metal4 vertical + Metal5 horizontal grid & core ring with exposed pins
# Custom PDN_CFG omits the default -macro grid (pure-passive R-2R macros have no PG pins).
PDN_CFG: dir::pdn_cfg.tcl
PDN_HORIZONTAL_HALO: 4.8
PDN_VERTICAL_HALO: 4.0
PDN_CORE_RING: True
PDN_CORE_RING_VWIDTH: 8
PDN_CORE_RING_HWIDTH: 8
PDN_CORE_RING_VSPACING: 2
PDN_CORE_RING_HSPACING: 2
PDN_CORE_RING_VOFFSET: 4
PDN_CORE_RING_HOFFSET: 4
PDN_VERTICAL_LAYER: Metal4
PDN_HORIZONTAL_LAYER: Metal5
PDN_VWIDTH: 4
PDN_HWIDTH: 4
PDN_VSPACING: 2
PDN_HSPACING: 2
PDN_VPITCH: 60
PDN_HPITCH: 60
PDN_ENABLE_PINS: True

# Protect analog nets/drivers, ICG, and padring tie outputs from OpenROAD Resizer
IGNORE_DISCONNECTED_MODULES:
  - r2r_ladder_8bit
RSZ_DONT_TOUCH_RX: ".*(u_tiel|u_tieh|u_bufh|u_bufl|u_icg|u_term|u_buf|u_r2r|term_tie|pre_drv|term_drv|in_drv|^ua\\[).*"
DESIGN_REPAIR_BUFFER_OUTPUT_PORTS: False
EXTRA_EXCLUDED_CELLS:
  - gf180mcu_fd_sc_mcu7t5v0__dlya_1
  - gf180mcu_fd_sc_mcu7t5v0__dlya_2
  - gf180mcu_fd_sc_mcu7t5v0__dlya_4
  - gf180mcu_fd_sc_mcu7t5v0__dlyb_1
  - gf180mcu_fd_sc_mcu7t5v0__dlyb_2
  - gf180mcu_fd_sc_mcu7t5v0__dlyb_4
  - gf180mcu_fd_sc_mcu7t5v0__dlyc_1
  - gf180mcu_fd_sc_mcu7t5v0__dlyc_2
  - gf180mcu_fd_sc_mcu7t5v0__dlyc_4
  - gf180mcu_fd_sc_mcu7t5v0__dlyd_1
  - gf180mcu_fd_sc_mcu7t5v0__dlyd_2
  - gf180mcu_fd_sc_mcu7t5v0__dlyd_4

# Placement / routing tuning
# Repair design slew/cap against slow corner with realistic OpenRCX wire cap (0.22 fF/um)
# Units match GF180MCU Liberty: Ohm/um and pF/um (fixed in open-pdks#582 / PDK 2fdf40d5)
DEFAULT_CORNER: nom_ss_125C_4v50
DESIGN_REPAIR_MAX_SLEW_PCT: 40
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 20
LAYERS_RC:
  "*":
    Metal2: {res: 0.225636, cap: 0.00022}
    Metal3: {res: 0.225636, cap: 0.00022}
    Metal4: {res: 0.225636, cap: 0.00022}
    Metal5: {res: 0.0585545, cap: 0.00022}
PL_TARGET_DENSITY_PCT: 50
GRT_ALLOW_CONGESTION: True
PL_RESIZER_HOLD_SLACK_MARGIN: 0.2
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.1
RUN_HEURISTIC_DIODE_INSERTION: False
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10

# Signoff
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
ERROR_ON_MAGIC_DRC: False
LINTER_INCLUDE_PDK_MODELS: True
RUN_KLAYOUT_XOR: True
RUN_KLAYOUT_DRC: True
RUN_LVS: True
