  u_tt.u_core.__dac__r2r_dac_8bit_map_r2r_dac_8bit_call__1_inst.gen_drv[3].u_buf: {location: [840.56, 846.72], orientation: N}
  u_tt.u_core.__dac__r2r_dac_8bit_map_r2r_dac_8bit_call__1_inst.gen_drv[2].u_buf: {location: [801.36, 850.64], orientation: FS}
  u_tt.u_core.__dac__r2r_dac_8bit_map_r2r_dac_8bit_call__1_inst.gen_drv[1].u_buf: {location: [820.96, 850.64], orientation: FS}
