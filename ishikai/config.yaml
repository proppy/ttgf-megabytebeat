# Reserve Metal5 for PDN + chip_top VDD_BB power straps
RT_MAX_LAYER: Metal4

# PDN: clean Metal4 vertical + Metal5 horizontal grid & core ring with exposed pins
# Custom PDN_CFG omits the default -macro grid (pure-passive R-2R macros have no PG pins).
PDN_CFG: dir::pdn_cfg.tcl
PDN_HORIZONTAL_HALO: 4.8
PDN_VERTICAL_HALO: 4.0
PDN_CORE_RING: True
PDN_CORE_RING_VWIDTH: 8
PDN_CORE_RING_HWIDTH: 8
PDN_CORE_RING_VSPACING: 2
PDN_CORE_RING_HSPACING: 2
PDN_CORE_RING_VOFFSET: 4
PDN_CORE_RING_HOFFSET: 4
PDN_VERTICAL_LAYER: Metal4
PDN_HORIZONTAL_LAYER: Metal5
PDN_VWIDTH: 4
PDN_HWIDTH: 4
PDN_VSPACING: 2
PDN_HSPACING: 2
PDN_VPITCH: 60
PDN_HPITCH: 60
PDN_ENABLE_PINS: True

# Protect analog nets/drivers/comparators, ICG, and padring tie outputs from OpenROAD Resizer
IGNORE_DISCONNECTED_MODULES:
  - r2r_ladder_8bit
  - r2r_ladder_4bit_sum
RSZ_DONT_TOUCH_RX: ".*(u_tiel|u_tieh|u_bufh|u_bufl|u_icg|u_term|u_buf|u_inv|u_cmp|u_r2r|term_tie|pre_drv|term_drv|in_drv|vsum|cmp_lo|cmp_raw|^ua\\[).*"
DESIGN_REPAIR_BUFFER_OUTPUT_PORTS: False
EXTRA_EXCLUDED_CELLS:
  - gf180mcu_fd_sc_mcu7t5v0__dlya_1
  - gf180mcu_fd_sc_mcu7t5v0__dlya_2
  - gf180mcu_fd_sc_mcu7t5v0__dlya_4
  - gf180mcu_fd_sc_mcu7t5v0__dlyb_1
  - gf180mcu_fd_sc_mcu7t5v0__dlyb_2
  - gf180mcu_fd_sc_mcu7t5v0__dlyb_4
  - gf180mcu_fd_sc_mcu7t5v0__dlyc_1
  - gf180mcu_fd_sc_mcu7t5v0__dlyc_2
  - gf180mcu_fd_sc_mcu7t5v0__dlyc_4
  - gf180mcu_fd_sc_mcu7t5v0__dlyd_1
  - gf180mcu_fd_sc_mcu7t5v0__dlyd_2
  - gf180mcu_fd_sc_mcu7t5v0__dlyd_4

# Placement / routing tuning
PL_TARGET_DENSITY_PCT: 50
GRT_ALLOW_CONGESTION: True
PL_RESIZER_HOLD_SLACK_MARGIN: 0.2
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.1
RUN_HEURISTIC_DIODE_INSERTION: True

# Signoff
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
ERROR_ON_MAGIC_DRC: False
LINTER_INCLUDE_PDK_MODELS: True
RUN_KLAYOUT_XOR: True
RUN_KLAYOUT_DRC: True
RUN_LVS: True
