meta:
  version: 3
  flow: Classic

DESIGN_NAME: megabytebeat_macro
VERILOG_FILES:
  - dir::../src/megabytebeat.v
  - dir::../src/pwm_audio.v
  - dir::../src/sc_adc_ramp_1ch_4b.v
  - dir::../src/sc_r2r_dac_8bit.v
  - dir::../src/tt_um_proppy_megabytebeat.v
  - dir::megabytebeat_macro.sv

PNR_SDC_FILE: dir::megabytebeat_macro.sdc
SIGNOFF_SDC_FILE: dir::megabytebeat_macro.sdc

# Separate VDD_BB power domain, shared VSS
VDD_NETS:
  - VDD_BB
GND_NETS:
  - VSS

# Clock: 2.048 MHz (same as upstream ttgf-megabytebeat)
CLOCK_PORT: clk
CLOCK_PERIOD: 488

# Floorplan: 960 x 960 um (VDD_BB mixed-signal macro with 4x 4-bit ramp ADC + 2x 8-bit R-2R DAC)
FP_SIZING: absolute
DIE_AREA: [0, 0, 960, 960]
CORE_AREA: [30, 30, 930, 930]
FP_PIN_ORDER_CFG: dir::pin_order.cfg
FP_MACRO_HORIZONTAL_HALO: 4.8
FP_MACRO_VERTICAL_HALO: 4.0

# 4x passive ramp ADC ladders near West pins ua[0..3] + 2x passive R-2R DAC ladders near East pins ua[4..5]
MACROS:
  r2r_ladder_4bit_sum:
    gds:
      - dir::../gen/adc/r2r_ladder_4bit_sum.gds
    lef:
      - dir::../gen/adc/r2r_ladder_4bit_sum.lef
    vh:
      - dir::../src/r2r_ladder_4bit_sum.v
    lib:
      "*":
        - dir::../gen/adc/r2r_ladder_4bit_sum.lib
    spice:
      - dir::../gen/adc/r2r_ladder_4bit_sum.spice
    instances:
      u_tt.u_core.__adc_ramp__adc_ramp_1ch_cmp_hi_inst.u_r2r:
        location: [60.48, 258.72]
        orientation: N
      u_tt.u_core.__adc_ramp__adc_ramp_1ch_cmp_hi__1_inst.u_r2r:
        location: [60.48, 423.36]
        orientation: N
      u_tt.u_core.__adc_ramp__adc_ramp_1ch_cmp_hi__2_inst.u_r2r:
        location: [60.48, 588.00]
        orientation: N
      u_tt.u_core.__adc_ramp__adc_ramp_1ch_cmp_hi__3_inst.u_r2r:
        location: [60.48, 752.64]
        orientation: N
  r2r_ladder_8bit:
    gds:
      - dir::../gen/dac/r2r_ladder_8bit.gds
    lef:
      - dir::../gen/dac/r2r_ladder_8bit.lef
    vh:
      - dir::../src/r2r_ladder_8bit.v
    lib:
      "*":
        - dir::../gen/dac/r2r_ladder_8bit.lib
    spice:
      - dir::../gen/dac/r2r_ladder_8bit.spice
    instances:
      u_tt.u_core.__dac__r2r_dac_8bit_map_r2r_dac_8bit_call_inst.u_r2r:
        location: [820.96, 729.12]
        orientation: N
      u_tt.u_core.__dac__r2r_dac_8bit_map_r2r_dac_8bit_call__1_inst.u_r2r:
        location: [820.96, 807.52]
        orientation: N

# Pre-place clkbuf_20 DAC drivers directly above each 8-bit R-2R ladder for low (< 30 Ohm) bit wire resistance
MANUAL_GLOBAL_PLACEMENTS:
  u_tt.u_core.__dac__r2r_dac_8bit_map_r2r_dac_8bit_call_inst.gen_drv[7].u_buf: {location: [820.96, 760.48], orientation: N}
