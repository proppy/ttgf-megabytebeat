  u_tt.u_core.__dac__r2r_dac_8bit_map_r2r_dac_8bit_call__1_inst.gen_drv[7].u_buf: {location: [820.96, 838.88], orientation: N}
  u_tt.u_core.__dac__r2r_dac_8bit_map_r2r_dac_8bit_call__1_inst.u_term: {location: [840.56, 838.88], orientation: N}
