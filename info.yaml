# Tiny Tapeout project information
project:
  title:        "megabytebeat"
  author:       "proppy"
  discord:      "proppy"
  description:  "Best-of compilation of bytebeat 2011's greatest hits on-a-chip with 5x 8-bit R-2R DAC analog outputs."
  language:     "xls"
  clock_hz:     2048000  # 8000 * 256
  tiles: "2x2"
  analog_pins: 5
  uses_vapwr: false
  top_module:  "tt_um_proppy_megabytebeat"
  source_files:
    - "tt_um_proppy_megabytebeat.v"
    - "pwm_audio.v"
    - "megabytebeat.sv"
    - "sc_r2r_dac_8bit.v"

pinout:
  # Inputs
  ui[0]: "param `a` bit 0/3"
  ui[1]: "param `a` bit 1/3"
  ui[2]: "param `a` bit 2/3"
  ui[3]: "param `a` bit 3/3"
  ui[4]: "param `b` bit 0/3"
  ui[5]: "param `b` bit 1/3"
  ui[6]: "param `b` bit 2/3"
  ui[7]: "param `b` bit 3/3"

  # Outputs
  uo[0]: "track #0 PWM output"
  uo[1]: "track #1 PWM output"
  uo[2]: "track #2 PWM output"
  uo[3]: "track #3 PWM output"
  uo[4]: "N/A"
  uo[5]: "N/A"
  uo[6]: "N/A"
  uo[7]: "track #7 PWM output"

  # Bidirectional pins
  uio[0]: "param `c` bit 0/3"
  uio[1]: "param `c` bit 1/3"
  uio[2]: "param `c` bit 2/3"
  uio[3]: "param `c` bit 3/3"
  uio[4]: "param `d` bit 0/3"
  uio[5]: "param `d` bit 1/3"
  uio[6]: "param `d` bit 2/3"
  uio[7]: "param `d` bit 3/3"

  # Analog pins
  ua[0]: "track #0 8-bit R-2R DAC output"
  ua[1]: "track #1 8-bit R-2R DAC output"
  ua[2]: "track #2 8-bit R-2R DAC output"
  ua[3]: "track #3 8-bit R-2R DAC output"
  ua[4]: "track #7 8-bit R-2R DAC output"
  ua[5]: ""

# Do not change!
yaml_version: 6
