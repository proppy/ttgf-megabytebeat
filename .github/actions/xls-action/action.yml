name: XLS
description: generate (System)Verilog from DSLX.

inputs:
  xls-repo:
    description: GitHub repository (owner/repo) providing XLS release tarballs.
    required: false
    type: string
    default: 'proppy/xls'
  xls-version:
    description: version of the XLS release to use.
    required: true
    type: string
  dslx-path:
    description: path to the input DSLX path.
    required: true
    type: string
  dslx-top:
    description: name of the DSLX top-level proc or function.
    required: true
    type: string
  ir-path:
    description: path to the intermediate XLS IR file.
    required: true
    type: string
  opt-ir-path:
    description: path to the optimized XLS IR file.
    required: true
    type: string
  verilog-path:
    description: path to the output Verilog path.
    required: true
    type: string
  verilog-module-name:
    description: name of the generated (System)Verilog module.
    required: true
    type: string
  verilog-reset-signal-name:
    description: name of the verilog reset signal.
    required: true
    type: string
  use-system-verilog:
    description: whether or not to generate SystemVerilog.
    required: true
    type: boolean
  clock-period-ps:
    description: desired clock period in picoseconds.
    required: true
    type: string
  delay-model:
    description: model to use for delay estimation and scheduling.
    required: true
    type: string
  area-model:
    description: optional model to use for area estimation during IR optimization.
    required: false
    type: string
    default: ''
  codegen-extra-args:
    description: extra arguments passed to codegen_main.
    required: false
    type: string
    default: ''
  artifact-name:
    description: name of the generated xls artifact
    type: string
    default: 'xls-generated'

runs:
  using: "composite"
  steps:
    - name: install XLS
      run: |
        curl --fail --show-error --silent -L "https://github.com/${{ inputs.xls-repo }}/releases/download/${{ inputs.xls-version }}/xls-${{ inputs.xls-version }}-linux-x64.tar.gz" | tar xvzf - -C /tmp
        echo "/tmp/xls-${{ inputs.xls-version }}-linux-x64" >> "$GITHUB_PATH"
      shell: bash
    - name: test DSLX
      run: |
        interpreter_main --compare=jit --dslx_stdlib_path=/tmp/xls-${{ inputs.xls-version }}-linux-x64/xls/dslx/stdlib --dslx_path=src ${{ inputs.dslx-path }}
      shell: bash
    - name: convert DSLX to XLS ir
      run: |
        ir_converter_main --dslx_stdlib_path=/tmp/xls-${{ inputs.xls-version }}-linux-x64/xls/dslx/stdlib --dslx_path=src --top=${{ inputs.dslx-top }} ${{ inputs.dslx-path }} > ${{ inputs.ir-path }}
      shell: bash
    - name: optimize XLS IR
      run: |
        OPT_ARGS=(--delay_model="${{ inputs.delay-model }}")
        if [[ -n "${{ inputs.area-model }}" ]]; then
          OPT_ARGS+=(--area_model="${{ inputs.area-model }}")
        fi
        opt_main "${OPT_ARGS[@]}" ${{ inputs.ir-path }} > ${{ inputs.opt-ir-path }}
      shell: bash
    - name: generate Verilog
      run: |
        codegen_main \
          --module_name=${{ inputs.verilog-module-name }} \
          --use_system_verilog=${{ inputs.use-system-verilog }} \
          --clock_period_ps=${{ inputs.clock-period-ps }} \
          --delay_model=${{ inputs.delay-model }} \
          --reset=${{ inputs.verilog-reset-signal-name }} \
          --output_schedule_path=${{ inputs.opt-ir-path }}.sched \
          --output_schedule_ir_path=${{ inputs.opt-ir-path }}.sched.ir \
          ${{ inputs.codegen-extra-args }} \
          ${{ inputs.opt-ir-path }} > ${{ inputs.verilog-path }}
      shell: bash
    - name: report scheduled delay
      run: |
        if delay_info_main \
          --delay_model=${{ inputs.delay-model }} \
          --schedule_path=${{ inputs.opt-ir-path }}.sched \
          ${{ inputs.opt-ir-path }}.sched.ir > ${{ inputs.opt-ir-path }}.delay 2>&1; then
          head -n 40 ${{ inputs.opt-ir-path }}.delay
        else
          echo "Note: delay_info_main skipped (unsupported FFI/invoke node in delay model):"
          head -n 10 ${{ inputs.opt-ir-path }}.delay
        fi
      shell: bash
    - name: upload XLS artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.ir-path }}
          ${{ inputs.opt-ir-path }}
          ${{ inputs.opt-ir-path }}.sched
          ${{ inputs.opt-ir-path }}.delay
          ${{ inputs.verilog-path }}
