name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup GF180MCU PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: gf180mcuD
          pdk_version: 0fe599b2afb6708d281543108caf8310912f54af
          pdk_root: ${{ runner.temp }}/pdk

      - name: Setup KLayout
        uses: ./.github/actions/setup-klayout

      - name: Setup Magic
        uses: ./.github/actions/setup-magic

      - name: Setup Verilator
        uses: ./.github/actions/setup-verilator

      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice

      - name: Setup uv & Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync

      - name: Harden TTGF26c 2x2 mixed-signal top (Digital-on-Top LibreLane + Magic PEX + SPEF check)
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
        run: |
          uv run python src/tools.py
          uv run python src/chip.py \
            --target tinytapeout \
            --librelane \
            --dockerized \
            --out-dir gen_tt
          cp gen_tt/xls/megabytebeat.sv src/megabytebeat.sv

      - name: Upload passive ADC/DAC SPICE, Magic PEX & post-PnR SPEF for GL AMS co-sim
        uses: actions/upload-artifact@v7
        with:
          name: dac-spice
          path: |
            gen_tt/dac/r2r_ladder_8bit.spice
            gen_tt/dac/r2r_ladder_8bit.pex.spice
            gen_tt/adc/r2r_ladder_4bit_sum.spice
            gen_tt/adc/r2r_ladder_4bit_sum.pex.spice
            gen_tt/final/spef/**/*.spef

      - name: Publish TTGF26c custom GDS artifact
        uses: TinyTapeout/tt-gds-action/custom_gds@ttgf26c
        with:
          top_module: tt_um_proppy_megabytebeat
          gds_path: gen_tt/final/gds/tt_um_proppy_megabytebeat.gds
          lef_path: gen_tt/final/lef/tt_um_proppy_megabytebeat.lef
          verilog_path: gen_tt/final/pnl/tt_um_proppy_megabytebeat.pnl.v
          pdk: gf180mcuD

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttgf26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download GDS artifact
        uses: actions/download-artifact@v7
        with:
          name: tt_submission

      - name: Download passive ADC/DAC SPICE, Magic PEX & post-PnR SPEF
        uses: actions/download-artifact@v7
        with:
          name: dac-spice
          path: gen

      - name: Setup GF180MCU PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: gf180mcuD
          pdk_version: 0fe599b2afb6708d281543108caf8310912f54af
          pdk_root: ${{ runner.temp }}/pdk

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Install Icarus Verilog and libngspice0
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog libngspice0

      - name: Setup Verilator
        uses: ./.github/actions/setup-verilator

      - name: Run GL tests (4-state Icarus + Verilator + ngspice AMS)
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
          AMS_NGSPICE: "1"
        run: |
          cp tt_submission/*.v test/gate_level_netlist.v
          cd test
          rm -f tb.vcd tb.fst results.xml
          make clean
          GATES=yes SIM=icarus COCOTB_TEST_FILTER="'test_reset_and_standby_power_gating|test_end_to_end_mixed_signal'" make
          python -m cocotb_tools.check_results results.xml
          rm -f tb.vcd tb.fst results.xml
          make clean
          GATES=yes SIM=verilator make
          python -m cocotb_tools.check_results results.xml

      - name: Upload Waveform and Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gatelevel_test_results
          path: |
            test/tb.vcd
            test/tb.fst
            test/results.xml
            test/output/*

      - name: Test Summary
        if: always()
        uses: test-summary/action@v2.6
        with:
          paths: test/results.xml

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttgf26c
