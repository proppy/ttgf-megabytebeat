name: ishikai

on:
  push:
  workflow_dispatch:
    inputs:
      sync_fork:
        description: "Push updated macro + ring/test commit to proppy/wafer_space_RUN3_sample:megabytebeat-sync"
        type: boolean
        default: true

jobs:
  macro:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Generate Verilog for megabytebeat
        uses: ./.github/actions/xls-action
        with:
          xls-repo: proppy/xls
          xls-version: v0.0.0-11264-g628b096fe
          dslx-path: src/megabytebeat.x
          dslx-top: megabytebeat
          ir-path: src/megabytebeat.ir
          opt-ir-path: src/megabytebeat.opt.ir
          verilog-path: src/megabytebeat.v
          verilog-module-name: megabytebeat
          verilog-reset-signal-name: reset
          use-system-verilog: false
          clock-period-ps: 30517500
          delay-model: gf180mcu_5v0
          area-model: gf180mcu_5v0
          ffi-fallback-delay-ps: 500
          artifact-name: xls-generated-megabytebeat-ishikai

      - name: Setup GF180MCU PDK (ISHI-KAI LibreLane 3.1)
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: gf180mcuD
          pdk_version: 792ef67037d74c8c51811eab3ce23cf793491296
          pdk_root: ${{ runner.temp }}/pdk

      - name: Setup GF180MCU PDK (analog DRC/LVS/PEX)
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: gf180mcuD
          pdk_version: 0fe599b2afb6708d281543108caf8310912f54af
          pdk_root: ${{ runner.temp }}/pdk_analog

      - name: Setup KLayout
        uses: ./.github/actions/setup-klayout

      - name: Setup Magic
        uses: ./.github/actions/setup-magic

      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice

      - name: Setup uv & Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync

      - name: Build & verify passive r2r_ladder_8bit macro & generate ISHI-KAI config
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk_analog
        run: |
          uv run python src/chip.py \
            --target ishikai \
            --verilog src/megabytebeat.v \
            --out gen/ishikai_config.yaml

      - name: Setup Python for LibreLane 3.1
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install LibreLane
        run: pip install --pre "librelane==3.1.0.dev6"

      - name: Harden megabytebeat_macro (LibreLane Classic, VDD_BB, 5x R-2R DAC, 32.768 kHz)
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
        run: |
          librelane \
            -m "$PDK_ROOT" \
            -m "$PWD" \
            --docker-no-tty \
            --dockerized \
            --pdk gf180mcuD \
            --pdk-root "$PDK_ROOT" \
            --manual-pdk \
            --scl gf180mcu_fd_sc_mcu7t5v0 \
            --save-views-to ishikai/final \
            gen/ishikai_config.yaml

      - name: Verify post-PnR 5x DAC routing parasitics in SPEF
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
        run: uv run python src/dac.py --check-spef ishikai/final/spef

      - name: Stage and validate drop-in bundle
        run: |
          python3 ishikai/stage_bundle.py \
            --repo-root . \
            --final-dir ishikai/final \
            --config gen/ishikai_config.yaml \
            --out-dir ishikai/bundle \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload ISHI-KAI macro bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: ishikai-megabytebeat-macro
          path: ishikai/bundle

  verify_and_sync:
    needs: macro
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download ISHI-KAI macro bundle
        uses: actions/download-artifact@v7
        with:
          name: ishikai-megabytebeat-macro
          path: ishikai_bundle

      - name: Clone upstream ishi-kai/wafer_space_RUN3_sample
        run: |
          git clone --single-branch --branch main \
            https://github.com/ishi-kai/wafer_space_RUN3_sample.git \
            upstream_ishikai

      - name: Apply wafer_space.patch and drop updated megabytebeat_macro into upstream tree
        run: |
          git -C upstream_ishikai apply "$PWD/ishikai/wafer_space.patch"
          rm -rf upstream_ishikai/chip/macros/megabytebeat
          mkdir -p upstream_ishikai/chip/macros/megabytebeat
          cp -a ishikai_bundle/. upstream_ishikai/chip/macros/megabytebeat/

      - name: Setup GF180MCU PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: gf180mcuD
          pdk_version: 792ef67037d74c8c51811eab3ce23cf793491296
          pdk_root: ${{ runner.temp }}/pdk

      - name: Verify full-chip chip_top LibreLane PnR + Netgen LVS
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
          LIBRELANE_IMAGE: ghcr.io/librelane/librelane:3.1.0.dev6
        run: |
          cat <<'EOF' > upstream_ishikai/chip/src/generated_defines.svh
          // This file is auto-generated by CI
          `define SLOT_0P5X1
          `define SRAM_gf180mcu_fd_ip_sram
          EOF
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e "HOME=/tmp" \
            -v "$PDK_ROOT:$PDK_ROOT" \
            -v "$PWD:$PWD" \
            -w "$PWD/upstream_ishikai/chip" \
            -e "PYTHONPATH=$PWD/upstream_ishikai/chip/librelane/plugins" \
            -e "SRAM_DEFINE=SRAM_gf180mcu_fd_ip_sram" \
            "$LIBRELANE_IMAGE" \
            librelane \
              librelane/slots/slot_0p5x1.yaml \
              librelane/macros/macros_gnss.yaml \
              librelane/config.yaml \
              --pdk gf180mcuD \
              --pdk-root "$PDK_ROOT" \
              --manual-pdk \
              --scl gf180mcu_fd_sc_mcu7t5v0 \
              --pad gf180mcu_fd_io \
              --save-views-to "$PWD/upstream_ishikai/chip/final" \
              --skip OpenROAD.IRDropReport \
              --skip Magic.StreamOut \
              --skip KLayout.Render \
              --skip KLayout.XOR \
              --skip KLayout.Antenna \
              --skip Checker.KLayoutAntenna \
              --skip KLayout.SealRing \
              --skip KLayout.Filler \
              --skip KLayout.Density \
              --skip Checker.KLayoutDensity \
              --skip Magic.DRC \
              --skip Checker.MagicDRC \
              --skip KLayout.DRC \
              --skip Checker.KLayoutDRC

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cocotb
        run: pip install -r test/requirements.txt

      - name: Verify full chip_top cocotb RTL (GL=0)
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
          PDK: gf180mcuD
          SLOT: 0p5x1
          PAD: gf180mcu_fd_io
          SCL: gf180mcu_fd_sc_mcu7t5v0
          SRAM: gf180mcu_fd_ip_sram
          GL: "0"
        run: |
          cd upstream_ishikai/chip/cocotb
          python3 chip_top_tb.py
          python3 -m cocotb_tools.check_results sim_build/results.xml

      - name: Verify full chip_top cocotb Gate-Level (GL=1)
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
          PDK: gf180mcuD
          SLOT: 0p5x1
          PAD: gf180mcu_fd_io
          SCL: gf180mcu_fd_sc_mcu7t5v0
          SRAM: gf180mcu_fd_ip_sram
          GL: "1"
        run: |
          cd upstream_ishikai/chip/cocotb
          python3 chip_top_tb.py
          python3 -m cocotb_tools.check_results sim_build/results.xml

      - name: Sync megabytebeat-sync branch to proppy/wafer_space_RUN3_sample
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.sync_fork != false)
        env:
          ISHIKAI_FORK_TOKEN: ${{ secrets.ISHIKAI_FORK_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
          FORK_REPO: proppy/wafer_space_RUN3_sample
          UPSTREAM_REPO: ishi-kai/wafer_space_RUN3_sample
          SYNC_BRANCH: megabytebeat-sync
        run: |
          if [ -z "$ISHIKAI_FORK_TOKEN" ]; then
            {
              echo "### ISHI会 Fork Sync Skipped"
              echo ""
              echo "Set repository secret \`ISHIKAI_FORK_TOKEN\` (fine-grained PAT with \`Contents: Read and write\` scoped to \`$FORK_REPO\`) to enable automatic sync pushes."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          COMMIT_MSG_FILE="$(mktemp)"
          trap 'rm -f "$COMMIT_MSG_FILE"' EXIT
          git log -1 --pretty=%B "$SOURCE_SHA" \
            | git interpret-trailers --trailer "Synced-From: https://github.com/${SOURCE_REPO}/commit/${SOURCE_SHA}" \
            > "$COMMIT_MSG_FILE"
          FORK_URL="https://x-access-token:${ISHIKAI_FORK_TOKEN}@github.com/${FORK_REPO}.git"

          cd upstream_ishikai
          # Clean LibreLane run artifacts, auto-generated defines, pycache, and cocotb outputs before staging
          git clean -fd chip/cocotb
          rm -rf chip/librelane/runs chip/src/generated_defines.svh
          find chip/librelane/plugins -type d -name __pycache__ -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PUSH_ARGS=()
          if git fetch --quiet "$FORK_URL" "refs/heads/${SYNC_BRANCH}"; then
            OLD_FORK_SHA="$(git rev-parse FETCH_HEAD)"
            if git merge-base --is-ancestor HEAD "$OLD_FORK_SHA"; then
              # Open PR branch is on current upstream main: append a fast-forward commit.
              git reset --mixed "$OLD_FORK_SHA"
            elif ! git merge-base --is-ancestor "$OLD_FORK_SHA" HEAD; then
              # Fork branch diverged from upstream main (e.g. after squash-merge or upstream commits).
              PUSH_ARGS=(--force-with-lease="refs/heads/${SYNC_BRANCH}:${OLD_FORK_SHA}")
            fi
          fi

          git add -A chip/macros/megabytebeat chip/src chip/librelane chip/cocotb
          if git diff --cached --quiet; then
            echo "No changes to chip/macros/megabytebeat or ring/test overlay; skipping push."
            exit 0
          fi

          git commit -F "$COMMIT_MSG_FILE"
          git push "${PUSH_ARGS[@]}" "$FORK_URL" "HEAD:refs/heads/${SYNC_BRANCH}"

          PR_URL="https://github.com/${UPSTREAM_REPO}/compare/main...${FORK_REPO/\//:}:${SYNC_BRANCH}?expand=1"
          {
            echo "### ISHI会 Fork Synced"
            echo ""
            echo "- **Branch**: [\`${FORK_REPO}:${SYNC_BRANCH}\`](https://github.com/${FORK_REPO}/tree/${SYNC_BRANCH})"
            echo "- **One-click PR**: [Open PR to \`${UPSTREAM_REPO}\`](${PR_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
