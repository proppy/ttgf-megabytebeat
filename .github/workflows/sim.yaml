name: sim

on:
  push:
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/sim.yaml"
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/sim.yaml"
  workflow_dispatch:

jobs:
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install EDA & simulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y klayout ngspice verilator iverilog

      - name: Setup GF180MCU PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: gf180mcuD
          pdk_version: 0fe599b2afb6708d281543108caf8310912f54af
          pdk_root: ${{ runner.temp }}/pdk

      - name: Setup uv & Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync

      - name: Verify R-2R DAC cell (DRC, LVS, Liberty, 256-code multi-corner ngspice)
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
        run: uv run python src/dac.py --bits 8 --check

      - name: Verify 4-bit Ramp ADC subsystem (XLS JIT, DRC, LVS, Liberty, 16-step multi-corner ngspice)
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
        run: uv run python src/adc.py --channels 4 --bits 4 --check

      - name: Verify Bresenham BPM / tap-tempo sync block (XLS JIT)
        run: uv run python src/bpm.py --step-samples 1024 --check

      - name: Verify unified multi-track megabytebeat proc (XLS JIT) and full-chip RTL/GL cocotb + PnR smoke
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
        run: |
          uv run python src/bytebeat.py --tracks 5 --check
          uv run python src/chip.py --target tinytapeout --out-dir gen_tt --sim
          uv run python src/chip.py --target waferspace --tracks 5 --pnr-smoke --sim

      - name: Verify closed-loop Eurorack mixed-signal co-simulation (ngspice d_cosim + Verilator)
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
        run: uv run python src/cosim.py --gen-dir gen --tracks 5 --cv-r-src 100
