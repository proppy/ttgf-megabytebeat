name: docs

on:
  push:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Generate Verilog for megabytebeat
        uses: ./.github/actions/xls-action
        with:
          xls-version: v0.0.0-8961-gf509bf088
          dslx-path: src/megabytebeat.x
          dslx-top: megabytebeat
          ir-path: src/megabytebeat.ir
          opt-ir-path: src/megabytebeat.opt.ir
          verilog-path: src/megabytebeat.v
          verilog-module-name: megabytebeat
          verilog-reset-signal-name: reset
          use-system-verilog: false
          clock-period-ps: 488281
          delay-model: unit
          artifact-name: xls-generated-megabytebeat


      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ttgf26c
