name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup KLayout
        uses: ./.github/actions/setup-klayout

      - name: Setup Magic
        uses: ./.github/actions/setup-magic

      - name: Setup Verilator
        uses: ./.github/actions/setup-verilator

      - name: Install ngspice and libngspice0
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice libngspice0

      - name: Setup GF180MCU PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: gf180mcuD
          pdk_version: 0fe599b2afb6708d281543108caf8310912f54af
          pdk_root: ${{ runner.temp }}/pdk

      - name: Setup uv & Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync

      - name: Verify native tool versions match LibreLane
        run: uv run python src/tools.py

      - name: Verify 4-bit Ramp ADC DSLX & SystemVerilog FFI codegen (adc_ramp.x)
        uses: ./.github/actions/xls-action
        with:
          xls-version: v0.0.0-11174-g32dc47058
          dslx-path: src/adc_ramp.x
          dslx-top: adc_ramp
          ir-path: /tmp/adc_ramp.ir
          opt-ir-path: /tmp/adc_ramp.opt.ir
          verilog-path: /tmp/adc_ramp.sv
          verilog-module-name: adc_ramp
          verilog-reset-signal-name: reset
          use-system-verilog: true
          clock-period-ps: 30517500
          delay-model: unit
          codegen-extra-args: --generator=pipeline --pipeline_stages=1 --flop_inputs=false --flop_outputs=false --reset_active_low=false --reset_asynchronous=false --reset_data_path=true
          artifact-name: xls-generated-adc-ramp

      - name: Verify R-2R ladder, 8-bit DAC & 4-bit Ramp ADC (DRC, LVS, Magic PEX, PVT ngspice, render)
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
        run: |
          uv run python src/dac.py
          uv run python src/adc.py

      - name: Generate SystemVerilog for megabytebeat
        uses: ./.github/actions/xls-action
        with:
          xls-repo: proppy/xls
          xls-version: v0.0.0-11264-g628b096fe
          dslx-path: src/megabytebeat.x
          dslx-top: megabytebeat
          ir-path: src/megabytebeat.ir
          opt-ir-path: src/megabytebeat.opt.ir
          verilog-path: src/megabytebeat.sv
          verilog-module-name: megabytebeat
          verilog-reset-signal-name: reset
          use-system-verilog: true
          clock-period-ps: 488281
          delay-model: gf180mcu_3v3
          area-model: gf180mcu_3v3
          ffi-fallback-delay-ps: 500
          artifact-name: xls-generated-megabytebeat

      - name: Run mixed-signal RTL tests (Verilator + libngspice0 cocotbext-ams)
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
          AMS_NGSPICE: "1"
        run: |
          cd test
          make clean
          WAVES=0 uv run make
          # make will return success even if the tests fail, so check results.xml for failed tests
          uv run python -m cocotb_tools.check_results results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/tb.vcd
            test/results.xml
            test/output/*
