name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup KLayout
        uses: ./.github/actions/setup-klayout

      - name: Setup Magic
        uses: ./.github/actions/setup-magic

      - name: Setup Verilator
        uses: ./.github/actions/setup-verilator

      - name: Install ngspice and libngspice0
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice libngspice0

      - name: Setup GF180MCU PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: gf180mcuD
          pdk_version: 0fe599b2afb6708d281543108caf8310912f54af
          pdk_root: ${{ runner.temp }}/pdk

      - name: Setup uv & Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync

      - name: Verify native tool versions match LibreLane
        run: uv run python src/tools.py

      - name: Verify 4-bit Ramp ADC DSLX & SystemVerilog FFI codegen (adc_ramp.x)
        uses: ./.github/actions/xls-action
        with:
          xls-repo: proppy/xls
          xls-version: v0.0.0-11264-g628b096fe
          dslx-path: src/adc_ramp.x
          dslx-top: adc_ramp
          ir-path: /tmp/adc_ramp.ir
          opt-ir-path: /tmp/adc_ramp.opt.ir
          verilog-path: /tmp/adc_ramp.sv
          verilog-module-name: adc_ramp
          verilog-reset-signal-name: reset
          use-system-verilog: true
          clock-period-ps: 30517500
          delay-model: gf180mcu_3v3
          area-model: gf180mcu_3v3
          ffi-fallback-delay-ps: 500
          artifact-name: xls-generated-adc-ramp

      - name: Verify Bresenham BPM / tap-tempo sync DSLX & SystemVerilog codegen (bpm_sync.x)
        uses: ./.github/actions/xls-action
        with:
          xls-repo: proppy/xls
          xls-version: v0.0.0-11264-g628b096fe
          dslx-path: src/bpm_sync.x
          dslx-top: bpm_sync
          ir-path: /tmp/bpm_sync.ir
          opt-ir-path: /tmp/bpm_sync.opt.ir
          verilog-path: /tmp/bpm_sync.sv
          verilog-module-name: bpm_sync
          verilog-reset-signal-name: reset
          use-system-verilog: true
          clock-period-ps: 30517500
          delay-model: gf180mcu_3v3
          area-model: gf180mcu_3v3
          artifact-name: xls-generated-bpm-sync

      - name: Verify analog macros (DRC/LVS/PEX/PVT/render) & 5-track RTL sim (chip.py)
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
        run: uv run python src/chip.py --target waferspace --tracks 5 --sim

      - name: Verify closed-loop Eurorack mixed-signal co-simulation (ngspice d_cosim + Verilator + Magic PEX)
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
        run: uv run python src/cosim.py --gen-dir gen --tracks 5 --cv-r-src 100

      - name: Generate SystemVerilog for fused megabytebeat core
        uses: ./.github/actions/xls-action
        with:
          xls-repo: proppy/xls
          xls-version: v0.0.0-11264-g628b096fe
          dslx-path: src/megabytebeat.x
          dslx-top: MegaBytebeat
          ir-path: src/megabytebeat.ir
          opt-ir-path: src/megabytebeat.opt.ir
          verilog-path: src/megabytebeat.sv
          verilog-module-name: megabytebeat
          verilog-reset-signal-name: reset
          use-system-verilog: true
          clock-period-ps: 476837
          delay-model: gf180mcu_3v3
          area-model: gf180mcu_3v3
          ffi-fallback-delay-ps: 500
          artifact-name: xls-generated-megabytebeat

      - name: Run TTGF26c mixed-signal RTL tests (Verilator + libngspice0 cocotbext-ams)
        env:
          PDK_ROOT: ${{ runner.temp }}/pdk
          AMS_NGSPICE: "1"
        run: |
          cd test
          make clean
          uv run make
          uv run python -m cocotb_tools.check_results results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/tb.vcd
            test/results.xml
            test/output/*
